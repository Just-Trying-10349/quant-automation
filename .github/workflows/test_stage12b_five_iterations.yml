name: STEP 12b - Five Iterations (Full Production Loop)

on:
  workflow_dispatch:

jobs:
  test-five-iterations:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure results directory exists
        run: |
          mkdir -p results

      - name: Snapshot strategy files BEFORE run
        run: |
          echo "========================================"
          echo "strategies/strategy.py BEFORE"
          echo "========================================"
          cat strategies/strategy.py
          echo ""
          echo "========================================"
          echo "strategies/best_strategy.py BEFORE"
          echo "========================================"
          cat strategies/best_strategy.py 2>/dev/null || echo "(does not exist yet)"
          echo ""
          echo "========================================"
          echo "config/parameters.json BEFORE (unmodified)"
          echo "========================================"
          cat config/parameters.json

      - name: Run actual run_research.py (real parameters.json, 5 iterations)
        env:
          NEMOTRON_API_KEY: ${{ secrets.NEMOTRON_API_KEY }}
        run: |
          python run_research.py

      - name: Snapshot strategy files AFTER run
        if: always()
        run: |
          echo "========================================"
          echo "strategies/strategy.py AFTER"
          echo "========================================"
          cat strategies/strategy.py
          echo ""
          echo "========================================"
          echo "strategies/best_strategy.py AFTER"
          echo "========================================"
          cat strategies/best_strategy.py 2>/dev/null || echo "(does not exist)"

      - name: Show uncommitted changes (nothing is pushed)
        if: always()
        run: |
          echo "========================================"
          echo "git diff/status (local to this runner only)"
          echo "Nothing here is committed or pushed."
          echo "========================================"
          git status --porcelain

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step12b-five-iterations
          path: |
            strategies/strategy.py
            strategies/best_strategy.py
          if-no-files-found: warn
