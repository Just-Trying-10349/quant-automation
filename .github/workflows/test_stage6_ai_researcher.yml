```yaml
name: STEP 6 - Test Actual AI Researcher

on:
  workflow_dispatch:

jobs:
  test-ai-researcher:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI dependency
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Check actual files
        run: |
          echo "Checking original project files..."

          test -f instructions/instructions.txt
          test -f strategies/strategy.py
          test -f config/ai_config.json
          test -f ai/ai_client.py
          test -f ai/ai_researcher.py
          test -f engine/validator.py
          test -f run_research.py

          echo "All required files exist."

      - name: Compile actual AI Python files
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "PYTHON COMPILATION TEST"
          echo "========================================"

          FILES=(
            "ai/ai_client.py"
            "ai/ai_researcher.py"
            "engine/validator.py"
            "run_research.py"
          )

          FAILED=0

          for FILE in "${FILES[@]}"; do

            echo ""
            echo "----------------------------------------"
            echo "Testing: $FILE"
            echo "----------------------------------------"

            python -m py_compile "$FILE"

            STATUS=$?

            if [ "$STATUS" -eq 0 ]; then
              echo "PASS: $FILE"
            else
              echo ""
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo "FAIL: $FILE"
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo ""

              echo "SOURCE CODE WITH LINE NUMBERS:"
              echo "========================================"

              nl -ba "$FILE"

              echo ""
              echo "PYTHON COMPILER OUTPUT:"
              echo "========================================"

              python -m py_compile "$FILE"

              FAILED=1
            fi

          done

          echo ""
          echo "========================================"

          if [ "$FAILED" -ne 0 ]; then
            echo "COMPILATION FAILED"
            echo "========================================"
            exit 1
          fi

          echo "ALL PYTHON FILES COMPILED SUCCESSFULLY"
          echo "========================================"

      - name: Import actual AI modules
        if: success()
        env:
          NEMOTRON_API_KEY: ${{ secrets.NEMOTRON_API_KEY }}
        run: |
          python - <<'PY'
          print("========================================")
          print("IMPORTING ACTUAL AI MODULES")
          print("========================================")

          from ai.ai_client import load_ai_config, create_client
          from ai.ai_researcher import (
              build_prompt,
              request_improvement
          )

          print("ai.ai_client import: PASS")
          print("ai.ai_researcher import: PASS")

          config = load_ai_config()

          print("Provider:", config["provider"])
          print("Model:", config["model"])
          print("Base URL:", config["base_url"])

          print("========================================")
          print("IMPORT TEST PASSED")
          print("========================================")
          PY

      - name: Test actual AI researcher
        if: success()
        env:
          NEMOTRON_API_KEY: ${{ secrets.NEMOTRON_API_KEY }}
        run: |
          python - <<'PY'
          from ai.ai_researcher import request_improvement
          from engine.validator import validate_strategy_code
          from run_research import extract_strategy

          print("========================================")
          print("ACTUAL AI RESEARCHER TEST")
          print("========================================")

          with open(
              "instructions/instructions.txt",
              "r",
              encoding="utf-8"
          ) as file:
              instructions = file.read()

          with open(
              "strategies/strategy.py",
              "r",
              encoding="utf-8"
          ) as file:
              strategy_code = file.read()

          previous_result = (
              "No previous result. "
              "This is the first researcher test."
          )

          previous_error = "No previous error."

          print("Calling actual request_improvement()...")

          response = request_improvement(
              instructions,
              strategy_code,
              previous_result,
              previous_error
          )

          if not response:
              raise RuntimeError(
                  "Nemotron returned an empty response."
              )

          print("")
          print("========================================")
          print("NEMOTRON RESPONSE RECEIVED")
          print("========================================")

          print(response)

          print("")
          print("Checking COMPLETE_STRATEGY_CODE...")

          if "COMPLETE_STRATEGY_CODE" not in response:
              raise RuntimeError(
                  "Nemotron response did not contain "
                  "COMPLETE_STRATEGY_CODE."
              )

          print("Marker found.")

          print("")
          print("Extracting candidate using actual")
          print("run_research.extract_strategy()...")

          candidate = extract_strategy(response)

          if not candidate.strip():
              raise RuntimeError(
                  "Extracted strategy is empty."
              )

          print("Candidate extracted.")

          print("")
          print("Validating candidate using actual")
          print("engine.validator.validate_strategy_code()...")

          valid, message = validate_strategy_code(candidate)

          print("Valid:", valid)
          print("Message:", message)

          if not valid:
              raise RuntimeError(
                  "Candidate failed validation: "
                  + message
              )

          print("")
          print("========================================")
          print("STEP 6 PASSED")
          print("========================================")
          PY
```
