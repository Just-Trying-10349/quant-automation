name: STEP 6 - Test Actual AI Researcher

on:
  workflow_dispatch:

jobs:
  test-ai-researcher:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI dependency
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Check actual AI researcher files
        run: |
          echo "Checking actual repository files..."

          test -f instructions/instructions.txt
          test -f strategies/strategy.py
          test -f config/ai_config.json
          test -f ai/ai_client.py
          test -f ai/ai_researcher.py
          test -f engine/validator.py
          test -f run_research.py

          echo "All required files exist."

      - name: Show Python versions
        run: |
          python --version
          pip --version

      - name: Compile actual AI Python files
        run: |
          echo "========================================"
          echo "COMPILING ACTUAL AI PYTHON FILES"
          echo "========================================"

          python -m py_compile ai/ai_client.py
          echo "ai/ai_client.py PASSED"

          python -m py_compile ai/ai_researcher.py
          echo "ai/ai_researcher.py PASSED"

          python -m py_compile engine/validator.py
          echo "engine/validator.py PASSED"

          python -m py_compile run_research.py
          echo "run_research.py PASSED"

      - name: Import actual AI modules
        env:
          NEMOTRON_API_KEY: ${{ secrets.NEMOTRON_API_KEY }}
        run: |
          python - <<'PY'
          print("========================================")
          print("IMPORTING ACTUAL AI MODULES")
          print("========================================")

          from ai.ai_client import load_ai_config, create_client
          from ai.ai_researcher import build_prompt, request_improvement

          print("ai_client imports PASSED")
          print("ai_researcher imports PASSED")

          config = load_ai_config()

          print("Provider:", config["provider"])
          print("Model:", config["model"])
          print("Base URL:", config["base_url"])

          print("========================================")
          print("IMPORT TEST COMPLETE")
          print("========================================")
          PY

      - name: Test actual AI researcher
        env:
          NEMOTRON_API_KEY: ${{ secrets.NEMOTRON_API_KEY }}
        run: |
          python - <<'PY'
          from ai.ai_researcher import request_improvement
          from engine.validator import validate_strategy_code
          from run_research import extract_strategy

          print("========================================")
          print("STEP 6 - ACTUAL AI RESEARCHER TEST")
          print("========================================")

          with open(
              "instructions/instructions.txt",
              "r",
              encoding="utf-8"
          ) as file:
              instructions = file.read()

          with open(
              "strategies/strategy.py",
              "r",
              encoding="utf-8"
          ) as file:
              strategy_code = file.read()

          previous_result = "No previous result. This is the first test."
          previous_error = "No previous error."

          print("Calling actual request_improvement()...")
          print("The AI is NOT allowed to modify repository files.")

          response = request_improvement(
              instructions,
              strategy_code,
              previous_result,
              previous_error
          )

          if not response:
              raise RuntimeError(
                  "AI returned an empty response."
              )

          print("")
          print("========================================")
          print("RAW NEMOTRON RESPONSE")
          print("========================================")
          print(response)

          print("")
          print("========================================")
          print("CHECKING REQUIRED MARKER")
          print("========================================")

          if "COMPLETE_STRATEGY_CODE" not in response:
              raise RuntimeError(
                  "Nemotron response did not contain "
                  "COMPLETE_STRATEGY_CODE."
              )

          print("COMPLETE_STRATEGY_CODE marker FOUND.")

          print("")
          print("========================================")
          print("EXTRACTING CANDIDATE")
          print("========================================")

          candidate = extract_strategy(response)

          if not candidate.strip():
              raise RuntimeError(
                  "Extracted strategy code is empty."
              )

          print("Candidate strategy extracted successfully.")

          print("")
          print("========================================")
          print("VALIDATING CANDIDATE")
          print("========================================")

          valid, message = validate_strategy_code(candidate)

          print("Validation result:", valid)
          print("Validation message:", message)

          if not valid:
              raise RuntimeError(
                  "Candidate strategy failed validation: "
                  + message
              )

          print("")
          print("========================================")
          print("STEP 6 PASSED")
          print("========================================")
          print("Actual AI researcher successfully:")
          print("1. Received the real instructions")
          print("2. Received the real strategy")
          print("3. Called Nemotron")
          print("4. Returned a response")
          print("5. Produced COMPLETE_STRATEGY_CODE")
          print("6. Passed the actual strategy extractor")
          print("7. Passed the actual validator")
          print("")
          print("No repository strategy was modified.")
          print("No Git commit was created.")
          print("No 5-loop system was started.")
          PY
